{% extends 'base.html' %}

{% block title %}Edit Profile - The Open Lens{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title mb-4">Edit Profile</h2>
                
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="text-center mb-4">
                        {% if user.profile.profile_picture %}
                            <img src="{{ user.profile.profile_picture.url }}"
                                 alt="Current Picture"
                                 class="rounded-circle"
                                 style="width: 120px; height: 120px; object-fit: cover;">
                        {% else %}
                            <i class="bi bi-person-circle display-3 text-secondary"></i>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Profile Picture</label>
                        {{ form.profile_picture }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Bio</label>
                        {{ form.bio }}
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
