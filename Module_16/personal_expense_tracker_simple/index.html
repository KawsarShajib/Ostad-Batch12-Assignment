<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 2. Initiating the project  -->
   
  <main class="container">
    <header class="app-header">
      <h1>Personal Expense Tracker</h1>
      <p>Track your income, expenses, and balance easily.</p>
    </header>

    <!-- 3. Building Dashboard : Total Income, Total Expenses, and Current Balance.  -->

    <section class="dashboard">
      <div class="card income-card">
        <h2>Total Income</h2>
        <p id="totalIncome">0</p>
      </div>

      <div class="card expense-card">
        <h2>Total Expenses</h2>
        <p id="totalExpenses">0</p>
      </div>

      <div class="card balance-card">
        <h2>Current Balance</h2>
        <p id="currentBalance">0</p>
      </div>
    </section>

    <!-- 4. Building Add Transaction form  -->
    
    <section class="form-section">
      <h2 id="formTitle">Add Transaction</h2>

      <form id="transactionForm">
        <div class="form-group">
          <label for="title">Transaction Title</label>
          <input
            type="text"
            id="title"
            placeholder="For example: Grocery shopping"
            required
          />
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="0.01"
            step="0.01"
            required
          />
        </div>

        <div class="form-group">
          <label for="type">Transaction Type</label>
          <select id="type" required>
            <option value="">Select type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Shopping">Shopping</option>
            <option value="Salary">Salary</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Health">Health</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>

        <button type="submit" id="submitButton">Add Transaction</button>
        <button type="button" id="cancelEditButton" class="hidden">
          Cancel Edit
        </button>
      </form>

      <p id="formMessage" class="form-message hidden"></p>
    </section>

    <!-- 7. Add Filter and Search  -->
    <div class="filters">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by title..."
      />

      <select id="filterType">
        <option value="all">All Transactions</option>
        <option value="income">Income</option>
        <option value="expense">Expenses</option>
      </select>
    </div>

    <!-- 5. Building Transaction History  -->

    <section class="history-section">
      
      <h2>Transaction History</h2>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Type</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="transactionTableBody"></tbody>
        </table>

        <p id="emptyMessage" class="empty-message hidden">
          No transactions found. Add your first transaction above.
        </p>
      </div>

      <!-- 11. Monthly Expenses Summary  -->
      <div class="monthly-summary">
        <h3>Monthly Expense Summary</h3>
        <div id="monthlySummary"></div>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
