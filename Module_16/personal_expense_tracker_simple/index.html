<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 1. Dashboard : Total Income, Total Expenses, and Current Balance.  -->
  <main class="container">
    <header class="app-header">
      <h1>Personal Expense Tracker</h1>
      <p>Track your income, expenses, and balance easily.</p>
    </header>

    <!-- 2. Dashboard : Total Income, Total Expenses, and Current Balance.  -->

    <section class="dashboard">
      <div class="card income-card">
        <h2>Total Income</h2>
        <p id="totalIncome">0</p>
      </div>

      <div class="card expense-card">
        <h2>Total Expenses</h2>
        <p id="totalExpenses">0</p>
      </div>

      <div class="card balance-card">
        <h2>Current Balance</h2>
        <p id="currentBalance">0</p>
      </div>
    </section>

    <!-- 3. Add Transaction form  -->
    
    <section class="form-section">
      <h2 id="formTitle">Add Transaction</h2>

      <form id="transactionForm">
        <div class="form-group">
          <label for="title">Transaction Title</label>
          <input
            type="text"
            id="title"
            placeholder="For example: Grocery shopping"
            required
          />
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="0.01"
            step="0.01"
            required
          />
        </div>

        <div class="form-group">
          <label for="type">Transaction Type</label>
          <select id="type" required>
            <option value="">Select type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Shopping">Shopping</option>
            <option value="Salary">Salary</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Health">Health</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>

        <button type="submit" id="submitButton">Add Transaction</button>
        <button type="button" id="cancelEditButton" class="hidden">
          Cancel Edit
        </button>
      </form>

      <p id="formMessage" class="form-message hidden"></p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
