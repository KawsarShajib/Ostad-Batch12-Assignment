{% extends 'base.html' %}

{% block title %}Edit Comment - MyBlog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 mb-4">
                    <i class="bi bi-pencil"></i> Edit Comment
                </h2>

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Your Comment</label>
                        {{ form.content }}
                        {% if form.content.errors %}
                            <div class="text-danger small">
                                {{ form.content.errors }}
                            </div>
                        {% endif %}
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Update Comment
                        </button>
                        <a href="{% url 'post_detail' comment.post.pk %}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
