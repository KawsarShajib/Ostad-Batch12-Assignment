<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager with API Integration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Task 2: ToDo App (Task Manager)</h1>
  </header>

  <main>
    <!-- TASK 2: Todo App -->
    <section class="card">
      <h2>My Tasks</h2>
      <form id="todo-form">
        <input type="text" id="todo-input" placeholder="Enter a new task..." autocomplete="off">
        <button type="submit">Add Task</button>
      </form>
      <p id="todo-error" class="error"></p>

      <div class="stats">
        <span>Total: <strong id="stat-total">0</strong></span>
        <span>Completed: <strong id="stat-completed">0</strong></span>
        <span>Pending: <strong id="stat-pending">0</strong></span>
      </div>

      <ul id="todo-list" class="list"></ul>
    </section>

  </main>

  <script src="js/todo.js"></script>
</body>
</html>
