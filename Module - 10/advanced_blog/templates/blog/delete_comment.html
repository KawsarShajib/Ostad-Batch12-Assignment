{% extends 'base.html' %}
{% block title %}Delete Comment - The Open Lens{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle text-danger display-4"></i>
                <h2 class="h4 mt-3">Delete Comment?</h2>
                <p class="text-muted">{{ comment.content|truncatewords:20 }}</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'post_detail' comment.post.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
